<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>ПОКЕ РАМЕН</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            font-family: 'Press Start 2P', 'Courier New', monospace;
            image-rendering: pixelated;
            image-rendering: crisp-edges;
        }
        body {
            background: #1a0a0a;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            touch-action: manipulation;
            padding: 4px;
        }
        #game-container {
            width: 100%;
            max-width: 420px;
            height: 100vh;
            max-height: 780px;
            background: #ffffff;
            border: 6px solid #cc0000;
            border-radius: 0px;
            overflow: hidden;
            position: relative;
            box-shadow: 0 0 0 4px #660000;
            image-rendering: pixelated;
            image-rendering: crisp-edges;
            display: flex;
            flex-direction: column;
        }
        .screen {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 16px;
            background: #ffffff;
            position: absolute;
            top: 0;
            left: 0;
            transition: opacity 0.2s;
            overflow: hidden;
        }
        .hidden {
            opacity: 0;
            pointer-events: none;
        }
        #start-screen {
            background: #ffffff;
            z-index: 10;
            gap: 24px;
        }
        #start-screen h1 {
            font-size: 42px;
            color: #cc0000;
            text-shadow: 4px 4px 0 #880000, 6px 6px 0 #ffffff;
            letter-spacing: 4px;
            text-align: center;
            line-height: 1.2;
            font-family: 'Press Start 2P', monospace;
        }
        #name-screen {
            background: #ffffff;
            z-index: 9;
            gap: 18px;
        }
        #name-screen input {
            background: #ffffff;
            border: 4px solid #cc0000;
            color: #000000;
            font-size: 20px;
            padding: 14px 18px;
            width: 80%;
            text-align: center;
            border-radius: 0px;
            font-family: 'Press Start 2P', monospace;
            outline: none;
        }
        #rules-screen {
            background: #ffffff;
            z-index: 8;
            gap: 18px;
            text-align: center;
            padding: 24px;
        }
        #rules-screen p {
            font-size: 16px;
            color: #000000;
            line-height: 1.6;
            max-width: 90%;
            font-family: 'Press Start 2P', monospace;
        }
        .pixel-btn {
            background: #cc0000;
            border: 4px solid #880000;
            color: #ffffff;
            font-size: 18px;
            padding: 14px 24px;
            border-radius: 0px;
            text-transform: uppercase;
            box-shadow: inset -4px -4px 0 #660000, inset 4px 4px 0 #ff4444;
            touch-action: manipulation;
            cursor: pointer;
            font-family: 'Press Start 2P', monospace;
            text-shadow: 2px 2px 0 #550000;
            letter-spacing: 2px;
        }
        .pixel-btn:active {
            transform: scale(0.94);
            box-shadow: inset 4px 4px 0 #660000, inset -4px -4px 0 #ff4444;
        }
        /* ====== ОСНОВНОЙ ЭКРАН ====== */
        #game-screen {
            background: #ffffff;
            z-index: 5;
            padding: 6px;
            justify-content: flex-start;
            gap: 4px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            height: 100%;
        }
        .game-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            padding: 4px 8px;
            background: #cc0000;
            border: 4px solid #880000;
            flex-shrink: 0;
            height: 38px;
            min-height: 38px;
        }
        .coin-display {
            background: #ffffff;
            padding: 4px 14px;
            border: 4px solid #880000;
            color: #000000;
            font-size: 14px;
            display: flex;
            align-items: center;
            gap: 6px;
            font-family: 'Press Start 2P', monospace;
            flex-shrink: 0;
        }
        .shift-btn {
            background: #ffffff;
            border: 4px solid #880000;
            color: #cc0000;
            font-size: 11px;
            padding: 4px 12px;
            font-family: 'Press Start 2P', monospace;
            cursor: pointer;
            flex-shrink: 0;
            white-space: nowrap;
        }
        .shift-btn:active {
            transform: scale(0.94);
        }
        .shift-btn.active {
            background: #ffdddd;
            color: #880000;
        }
        /* ====== 1/4 — ЧЕКИ ====== */
        .orders-area {
            width: 100%;
            background: #ffeeee;
            border: 4px solid #cc0000;
            padding: 6px;
            flex-shrink: 0;
            overflow-x: auto;
            overflow-y: hidden;
            white-space: nowrap;
            height: 25%;
            min-height: 25%;
            max-height: 25%;
            display: flex;
            align-items: stretch;
            gap: 6px;
        }
        .orders-area::-webkit-scrollbar {
            height: 8px;
            background: #ddcccc;
        }
        .orders-area::-webkit-scrollbar-thumb {
            background: #cc0000;
            border: 2px solid #880000;
        }
        .scroll-content {
            display: flex;
            gap: 6px;
            align-items: stretch;
            padding: 2px;
            height: 100%;
        }
        .order-card {
            background: #ffffff;
            border: 4px solid #cc0000;
            padding: 4px 8px;
            display: inline-flex;
            flex-direction: column;
            justify-content: space-between;
            min-width: 140px;
            max-width: 170px;
            flex-shrink: 0;
            font-size: 9px;
            font-family: 'Press Start 2P', monospace;
            gap: 2px;
            height: 100%;
        }
        .order-card .timer {
            color: #cc0000;
            font-size: 13px;
        }
        .order-card .timer.urgent {
            color: #ff0000;
            animation: blink 0.5s infinite;
        }
        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }
        .order-card .dishes-list {
            display: flex;
            flex-wrap: wrap;
            gap: 3px;
            justify-content: center;
            flex: 1;
            align-content: center;
        }
        .order-card .dishes-list .d-item {
            background: #ffcccc;
            padding: 2px 6px;
            border: 2px solid #cc0000;
            font-size: 7px;
            font-family: 'Press Start 2P', monospace;
            word-break: break-word;
            white-space: normal;
            max-width: 100%;
            text-align: center;
            line-height: 1.3;
            display: inline-flex;
            align-items: center;
            gap: 4px;
        }
        .order-card .dishes-list .d-item img {
            width: 24px;
            height: 24px;
            object-fit: contain;
            image-rendering: pixelated;
            image-rendering: crisp-edges;
            flex-shrink: 0;
        }
        .order-card .dishes-list .d-item.done {
            background: #7ae07a;
            border-color: #2d8a4e;
            text-decoration: line-through;
            opacity: 0.6;
        }
        .order-card .dishes-list .d-item.current {
            border-color: #ff8800;
            background: #ffe0b0;
        }
        .order-card .card-actions {
            margin-top: 2px;
            text-align: center;
            flex-shrink: 0;
        }
        .order-card .card-actions .cook-btn {
            background: #cc0000;
            border: 3px solid #880000;
            color: #ffffff;
            padding: 2px 10px;
            font-size: 8px;
            font-family: 'Press Start 2P', monospace;
            cursor: pointer;
            display: inline-block;
        }
        .order-card .card-actions .cook-btn:active {
            transform: scale(0.92);
        }
        .order-card .done-label {
            color: #2d8a4e;
            font-size: 9px;
        }
        .order-card .count-badge {
            font-size: 8px;
            color: #880000;
        }
        .order-card .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-shrink: 0;
        }
        /* ====== НИЖНЯЯ ЧАСТЬ — КУХНЯ ====== */
        .kitchen-area {
            flex: 1;
            background: #ffdddd;
            border: 4px solid #cc0000;
            padding: 6px;
            display: flex;
            flex-direction: column;
            gap: 4px;
            overflow: hidden;
            min-height: 0;
            height: 75%;
        }
        /* ====== 1/4 — РЕЦЕПТ ====== */
        .recipe-display {
            background: #ffffff;
            border: 4px solid #cc0000;
            padding: 6px 8px;
            text-align: center;
            font-size: 9px;
            flex-shrink: 0;
            font-family: 'Press Start 2P', monospace;
            height: 33.33%;
            min-height: 33.33%;
            max-height: 33.33%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            overflow: hidden;
        }
        .recipe-display .dish-name {
            color: #cc0000;
            font-size: 12px;
            line-height: 1.4;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        .recipe-display .dish-name img {
            width: 32px;
            height: 32px;
            object-fit: contain;
            image-rendering: pixelated;
            image-rendering: crisp-edges;
            flex-shrink: 0;
        }
        .recipe-display .ing-list {
            display: flex;
            flex-wrap: wrap;
            gap: 3px;
            justify-content: center;
            margin-top: 3px;
        }
        .recipe-display .ing-list span {
            background: #ffdddd;
            padding: 2px 8px;
            border: 2px solid #cc0000;
            font-size: 7px;
            font-family: 'Press Start 2P', monospace;
            line-height: 1.3;
        }
        .recipe-display .ing-list span.done {
            background: #7ae07a;
            border-color: #2d8a4e;
        }
        .recipe-display .progress-info {
            font-size: 7px;
            color: #880000;
            margin-top: 2px;
            line-height: 1.3;
        }
        /* ====== 1/4 — ИНГРЕДИЕНТЫ ====== */
        .ingredient-row {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            justify-content: center;
            background: #ffcccc;
            padding: 8px;
            border: 4px solid #cc0000;
            flex-shrink: 0;
            height: 33.33%;
            min-height: 33.33%;
            max-height: 33.33%;
            align-content: center;
            overflow: hidden;
        }
        .ingredient-box {
            background: #ffffff;
            border: 4px solid #cc0000;
            width: 52px;
            height: 52px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 22px;
            transition: 0.05s linear;
            flex-shrink: 0;
            overflow: hidden;
            image-rendering: pixelated;
            image-rendering: crisp-edges;
        }
        .ingredient-box:active {
            transform: scale(0.92);
            border-color: #ff4444;
        }
        .ingredient-box img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            image-rendering: pixelated;
            image-rendering: crisp-edges;
        }
        /* ====== 1/8 — СБОРКА ====== */
        .assembly-zone {
            background: #ffffff;
            border: 4px dashed #cc0000;
            padding: 4px;
            min-height: 0;
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: center;
            gap: 3px;
            flex-shrink: 0;
            height: 12.5%;
            min-height: 12.5%;
            max-height: 12.5%;
            overflow: hidden;
        }
        .assembly-zone .placed {
            background: #ffcccc;
            border: 2px solid #cc0000;
            padding: 2px 8px;
            font-size: 7px;
            font-family: 'Press Start 2P', monospace;
            line-height: 1.3;
            display: flex;
            align-items: center;
            gap: 4px;
        }
        .assembly-zone .placed img {
            width: 20px;
            height: 20px;
            object-fit: contain;
            image-rendering: pixelated;
            image-rendering: crisp-edges;
        }
        /* ====== 1/8 — ВСЁ ОСТАЛЬНОЕ ====== */
        .kitchen-bottom {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 3px;
            min-height: 0;
            height: 12.5%;
            padding: 2px 0;
        }
        .action-buttons {
            display: flex;
            flex-wrap: wrap;
            gap: 4px;
            justify-content: center;
            flex-shrink: 0;
            padding: 2px 0;
        }
        .action-btn {
            padding: 3px 12px;
            font-size: 9px;
            border: 3px solid;
            cursor: pointer;
            font-family: 'Press Start 2P', monospace;
            background: #2d8a4e;
            border-color: #1a5a30;
            color: #ffffff;
            text-shadow: 2px 2px 0 #0f3a1f;
            box-shadow: inset -3px -3px 0 #0f3a1f, inset 3px 3px 0 #5ab87a;
            flex: 0 1 auto;
            line-height: 1.3;
        }
        .action-btn:active {
            transform: scale(0.94);
        }
        .action-btn:disabled {
            opacity: 0.5;
            transform: none !important;
            cursor: not-allowed;
        }
        .action-btn.fold {
            background: #e67e22;
            border-color: #a04000;
            text-shadow: 2px 2px 0 #6b2f00;
            box-shadow: inset -3px -3px 0 #6b2f00, inset 3px 3px 0 #f39c12;
        }
        .action-btn.steam {
            background: #2d8a4e;
            border-color: #1a5a30;
            text-shadow: 2px 2px 0 #0f3a1f;
            box-shadow: inset -3px -3px 0 #0f3a1f, inset 3px 3px 0 #5ab87a;
        }
        .action-btn.done {
            background: #2d8a4e;
            border-color: #1a5a30;
            text-shadow: 2px 2px 0 #0f3a1f;
            box-shadow: inset -3px -3px 0 #0f3a1f, inset 3px 3px 0 #5ab87a;
        }
        .action-btn.next {
            background: #2980b9;
            border-color: #1a5276;
            text-shadow: 2px 2px 0 #0f2f4a;
            box-shadow: inset -3px -3px 0 #0f2f4a, inset 3px 3px 0 #5dade2;
        }
        .step-hint {
            font-size: 8px;
            text-align: center;
            padding: 3px;
            background: #ffeeee;
            border: 3px solid #cc0000;
            font-family: 'Press Start 2P', monospace;
            flex-shrink: 0;
            min-height: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            line-height: 1.3;
        }
        .steam-center {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 2px;
            padding: 2px;
        }
        .steam-center .steam-label {
            font-family: 'Press Start 2P', monospace;
            color: #1a5a30;
            font-size: 9px;
        }
        .steam-center .steam-timer {
            font-size: 16px;
            padding: 2px 14px;
            border: 3px solid #2d8a4e;
            background: #d4e6f1;
            color: #1a5a30;
            font-family: 'Press Start 2P', monospace;
        }
        #steamTimerContainer {
            display: none;
            justify-content: center;
            width: 100%;
        }
        .message-bar {
            width: 100%;
            background: #cc0000;
            border: 4px solid #880000;
            padding: 4px 10px;
            color: #ffffff;
            font-size: 9px;
            text-align: center;
            min-height: 24px;
            flex-shrink: 0;
            font-family: 'Press Start 2P', monospace;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            line-height: 1.3;
        }
        .kitchen-status {
            color: #cc0000;
            font-size: 9px;
            text-align: center;
            flex-shrink: 0;
            font-family: 'Press Start 2P', monospace;
            padding: 2px 0;
            line-height: 1.3;
        }
        .recipe-content {
            display: flex;
            flex-direction: column;
            justify-content: center;
            height: 100%;
        }
        .order-card .d-item-long {
            font-size: 6px;
            padding: 1px 4px;
        }
        .recipe-display .recipe-label {
            font-size: 8px;
            color: #880000;
        }
        .ingredient-box .ing-label {
            display: none;
        }
        /* Маппинг блюд на текстуры */
        .dish-icon {
            width: 24px;
            height: 24px;
            object-fit: contain;
            image-rendering: pixelated;
            image-rendering: crisp-edges;
        }
        .dish-icon-large {
            width: 32px;
            height: 32px;
            object-fit: contain;
            image-rendering: pixelated;
            image-rendering: crisp-edges;
        }
        .dish-icon-order {
            width: 20px;
            height: 20px;
            object-fit: contain;
            image-rendering: pixelated;
            image-rendering: crisp-edges;
        }
    </style>
</head>
<body>
<div id="game-container">
    <!-- СТАРТ -->
    <div id="start-screen" class="screen">
        <h1>ПОКЕ<br>РАМЕН</h1>
        <button class="pixel-btn" id="startBtn">Начать</button>
        <div style="font-size:12px; color:#880000; margin-top:20px; font-family:'Press Start 2P',monospace;">16-bit kitchen</div>
    </div>

    <!-- ИМЯ -->
    <div id="name-screen" class="screen hidden">
        <h2 style="color:#cc0000; text-shadow:2px 2px 0 #880000; font-family:'Press Start 2P',monospace; font-size:24px;">Введи имя</h2>
        <input type="text" id="nameInput" maxlength="12" placeholder="Шеф-повар" value="Кунг-пао">
        <button class="pixel-btn" id="nameConfirmBtn">Готово</button>
    </div>

    <!-- ПРАВИЛА -->
    <div id="rules-screen" class="screen hidden">
        <p id="rulesText">Привет, Шеф! Ты повар в кафе "Поке рамен", твоя задача выполнять заказы, которые тебе будут приходить</p>
        <button class="pixel-btn" id="rulesAcceptBtn">На кухню!</button>
    </div>

    <!-- ИГРА -->
    <div id="game-screen" class="screen hidden">
        <div class="game-header">
            <div class="coin-display">🪙 <span id="coinCount">0</span></div>
            <button class="shift-btn" id="shiftBtn">Выйти на смену</button>
        </div>

        <!-- ===== 1/4 — ЧЕКИ ===== -->
        <div class="orders-area" id="ordersArea">
            <div class="scroll-content" id="orderList"></div>
        </div>

        <!-- ===== 3/4 — КУХНЯ ===== -->
        <div class="kitchen-area">
            <div class="kitchen-status" id="kitchenStatus">🍳 Нажми «Выйти на смену»</div>

            <!-- 1/4 — РЕЦЕПТ -->
            <div class="recipe-display">
                <span class="recipe-label">📖 РЕЦЕПТ</span>
                <div id="recipeContent" class="recipe-content">
                    <span style="color:#880000; font-size:8px;">Выберите заказ</span>
                </div>
            </div>

            <!-- 1/4 — ИНГРЕДИЕНТЫ -->
            <div class="ingredient-row" id="ingredientBoxes">
                <div class="ingredient-box" data-ing="клубника"><img src="ph/st.png" alt="st"></div>
                <div class="ingredient-box" data-ing="творожный сыр"><img src="ph/ch.png" alt="ch"></div>
                <div class="ingredient-box" data-ing="тесто"><img src="ph/tes.png" alt="tes"></div>
                <div class="ingredient-box" data-ing="лосось"><img src="ph/sal.png" alt="sal"></div>
                <div class="ingredient-box" data-ing="креветка"><img src="ph/cr.png" alt="cr"></div>
                <div class="ingredient-box" data-ing="рисовое тесто"><img src="ph/ris_tes.png" alt="ris_tes"></div>
                <div class="ingredient-box" data-ing="смородина"><img src="ph/cmor.png" alt="cmor"></div>
            </div>

            <!-- 1/8 — СБОРКА -->
            <div class="assembly-zone" id="assemblyArea">
                <span style="color:#880000; font-size:8px; font-family:'Press Start 2P',monospace;">📦 Сборка</span>
            </div>

            <!-- 1/8 — ВСЁ ОСТАЛЬНОЕ -->
            <div class="kitchen-bottom">
                <div class="action-buttons" id="actionButtons"></div>

                <div id="steamTimerContainer">
                    <div class="steam-center">
                        <div class="steam-label">♨️ ПАРИТСЯ</div>
                        <div class="steam-timer" id="steamTimerDisplay">5с</div>
                    </div>
                </div>

                <div class="step-hint" id="stepHint">Нажмите "Готовить" у заказа</div>
            </div>
        </div>

        <div class="message-bar" id="messageBar">🍜 Добро пожаловать!</div>
    </div>
</div>
<script>
    (function() {
        // ---------- DATA ----------
        // Маппинг блюд на текстуры
        const DISH_IMAGES = {
            'Моти с клубникой': 'ph/moti_st.png',
            'Дим сам': 'ph/dim.png',
            'Моти со смородиной': 'ph/moti_smor.png'
        };

        const MENU = {
            'Моти с клубникой': {
                ingredients: ['рисовое тесто', 'клубника', 'творожный сыр'],
                price: 15,
                needsSteam: false,
                display: 'Моти с клубникой',
                icon: 'ph/moti_st.png'
            },
            'Дим сам': {
                ingredients: ['тесто', 'лосось', 'креветка'],
                price: 20,
                needsSteam: true,
                display: 'Дим сам',
                icon: 'ph/dim.png'
            },
            'Моти со смородиной': {
                ingredients: ['смородина', 'рисовое тесто', 'творожный сыр'],
                price: 15,
                needsSteam: false,
                display: 'Моти со смородиной',
                icon: 'ph/moti_smor.png'
            }
        };
        const ALL_DISHES = Object.keys(MENU);

        // Маппинг ингредиентов на пути к текстурам
        const INGREDIENT_IMAGES = {
            'клубника': 'ph/st.png',
            'творожный сыр': 'ph/ch.png',
            'тесто': 'ph/tes.png',
            'лосось': 'ph/sal.png',
            'креветка': 'ph/cr.png',
            'рисовое тесто': 'ph/ris_tes.png',
            'смородина': 'ph/cmor.png'
        };

        // ---------- STATE ----------
        let state = {
            name: 'Шеф',
            coins: 0,
            orders: [],
            totalOrdersServed: 0,
            shiftActive: false,
            orderInterval: null,
            timerInterval: null,
            currentCookingOrderIdx: -1,
            currentDishIndex: 0,
            assembled: [],
            currentDishName: null,
            neededIngredients: [],
            isFolded: false,
            isSteaming: false,
            steamSeconds: 5,
            steamTimer: null,
            steamInterval: null,
            gameOver: false,
            orderCounter: 0,
        };

        // DOM refs
        const $ = id => document.getElementById(id);
        const startScreen = $('start-screen');
        const nameScreen = $('name-screen');
        const rulesScreen = $('rules-screen');
        const gameScreen = $('game-screen');
        const nameInput = $('nameInput');
        const rulesText = $('rulesText');
        const coinCount = $('coinCount');
        const shiftBtn = $('shiftBtn');
        const kitchenStatus = $('kitchenStatus');
        const orderList = $('orderList');
        const messageBar = $('messageBar');
        const recipeContent = $('recipeContent');
        const assemblyArea = $('assemblyArea');
        const stepHint = $('stepHint');
        const actionButtons = $('actionButtons');
        const steamTimerContainer = $('steamTimerContainer');
        const steamTimerDisplay = $('steamTimerDisplay');
        const ordersArea = $('ordersArea');

        function updateCoins() {
            coinCount.textContent = state.coins;
        }

        function showMessage(msg) {
            messageBar.textContent = msg;
        }

        function scrollOrdersToEnd() {
            setTimeout(() => {
                ordersArea.scrollLeft = ordersArea.scrollWidth;
            }, 50);
        }

        // ---------- GAME MECHANICS ----------
        function getDishCount() {
            const orderNum = state.orderCounter + 1;
            if (orderNum <= 3) return 1;
            else if (orderNum <= 15) return Math.random() < 0.5 ? 1 : 2;
            else {
                const rand = Math.random();
                if (rand < 0.33) return 1;
                if (rand < 0.66) return 2;
                return 3;
            }
        }

        function getOrderTime(dishesCount) {
            if (dishesCount === 1) return 30;
            if (dishesCount === 2) return 50;
            return 70;
        }

        function generateOrder() {
            if (!state.shiftActive || state.gameOver) return;
            const count = getDishCount();
            const dishes = [];
            for (let i=0; i<count; i++) {
                dishes.push(ALL_DISHES[Math.floor(Math.random() * ALL_DISHES.length)]);
            }
            const timeLimit = getOrderTime(count);
            const order = {
                dishes: dishes,
                remaining: timeLimit,
                timer: timeLimit,
                cooked: false,
                completed: false,
                dishCompleted: new Array(dishes.length).fill(false),
                index: Date.now() + Math.random()
            };
            state.orders.push(order);
            state.orderCounter++;
            renderOrders();
            scrollOrdersToEnd();
            const dishNames = dishes.map(d => MENU[d].display).join(', ');
            showMessage(`📩 Заказ #${state.orderCounter}: ${dishNames} (${timeLimit}с)`);
        }

        function renderOrders() {
            orderList.innerHTML = '';
            state.orders.forEach((order, idx) => {
                if (order.completed) return;
                const card = document.createElement('div');
                card.className = 'order-card';
                const remaining = Math.ceil(order.remaining);
                const timerClass = remaining <= 5 ? 'timer urgent' : 'timer';
                
                let dishesHtml = order.dishes.map((d, i) => {
                    const display = MENU[d]?.display || d;
                    const icon = MENU[d]?.icon || '';
                    const isDone = order.dishCompleted[i];
                    const isCurrent = state.currentCookingOrderIdx === idx && state.currentDishIndex === i && !isDone;
                    let cls = 'd-item';
                    if (display.length > 12) cls += ' d-item-long';
                    if (isDone) cls += ' done';
                    if (isCurrent) cls += ' current';
                    return `<span class="${cls}"><img src="${icon}" alt="${display}" class="dish-icon"> ${display} ${isDone ? '✅' : ''}</span>`;
                }).join('');
                
                const allDone = order.dishCompleted.every(v => v === true);
                
                let actionsHtml = '';
                if (!allDone) {
                    actionsHtml = `<button class="cook-btn" data-orderidx="${idx}">🔪 Готовить</button>`;
                } else {
                    actionsHtml = `<span class="done-label">✅ Заказ готов!</span>`;
                }
                
                card.innerHTML = `
                    <div class="card-header">
                        <span class="${timerClass}">⏱ ${remaining}с</span>
                        <span class="count-badge">${order.dishes.length} бл.</span>
                    </div>
                    <div class="dishes-list">${dishesHtml}</div>
                    <div class="card-actions">${actionsHtml}</div>
                `;
                
                const btn = card.querySelector('.cook-btn');
                if (btn) {
                    btn.addEventListener('click', (e) => {
                        e.stopPropagation();
                        const i = parseInt(btn.dataset.orderidx);
                        startCooking(i);
                    });
                }
                orderList.appendChild(card);
            });
        }

        function startCooking(orderIdx) {
            if (state.gameOver || !state.shiftActive) return;
            const order = state.orders[orderIdx];
            if (!order || order.completed) return;
            if (order.dishCompleted.every(v => v === true)) {
                showMessage('✅ Все блюда уже готовы!');
                return;
            }
            if (state.currentCookingOrderIdx !== -1) {
                const cur = state.orders[state.currentCookingOrderIdx];
                if (cur && !cur.completed && !cur.dishCompleted.every(v => v === true)) {
                    showMessage('⚠️ Сначала закончите текущее блюдо');
                    return;
                }
            }
            let dishIdx = order.dishCompleted.findIndex(v => !v);
            if (dishIdx === -1) { showMessage('✅ Все блюда готовы!'); return; }
            
            if (state.steamTimer) clearTimeout(state.steamTimer);
            if (state.steamInterval) clearInterval(state.steamInterval);
            state.isSteaming = false;
            state.steamSeconds = 5;
            steamTimerContainer.style.display = 'none';
            
            state.currentCookingOrderIdx = orderIdx;
            state.currentDishIndex = dishIdx;
            state.assembled = [];
            state.currentDishName = order.dishes[dishIdx];
            state.neededIngredients = MENU[state.currentDishName].ingredients.slice();
            state.isFolded = false;
            
            renderCookingUI();
            renderOrders();
            const display = MENU[state.currentDishName].display;
            showMessage(`🔪 Готовим ${display} (${dishIdx+1}/${order.dishes.length})`);
        }

        function renderCookingUI() {
            const order = state.orders[state.currentCookingOrderIdx];
            if (!order || !state.currentDishName) {
                recipeContent.innerHTML = '<span style="color:#880000; font-size:8px;">Выберите заказ</span>';
                assemblyArea.innerHTML = '<span style="color:#880000; font-size:8px; font-family:\'Press Start 2P\',monospace;">📦 Сборка</span>';
                stepHint.textContent = 'Нажмите "Готовить" у заказа';
                actionButtons.innerHTML = '';
                return;
            }
            const recipe = MENU[state.currentDishName];
            if (!recipe) return;

            const totalDishes = order.dishes.length;
            const doneCount = order.dishCompleted.filter(v => v).length;
            const progressText = totalDishes > 1 ? `Блюдо ${state.currentDishIndex+1}/${totalDishes} (готово ${doneCount}/${totalDishes})` : '';

            // Рецепт с иконкой блюда
            let recipeHtml = `<div class="dish-name">
                                <img src="${recipe.icon}" alt="${recipe.display}" class="dish-icon-large">
                                ${recipe.display}
                            </div>`;
            recipeHtml += `<div class="ing-list">`;
            recipe.ingredients.forEach(ing => {
                const has = state.assembled.includes(ing);
                recipeHtml += `<span class="${has ? 'done' : ''}">${ing} ${has ? '✅' : ''}</span>`;
            });
            recipeHtml += `</div>`;
            if (recipe.needsSteam) {
                recipeHtml += `<div style="margin-top:2px; color:#1a5a30; font-size:7px;">♨️ Требуется пароварка</div>`;
            }
            if (progressText) {
                recipeHtml += `<div class="progress-info">${progressText}</div>`;
            }
            recipeContent.innerHTML = recipeHtml;

            // Сборка с текстурами
            let assemblyHtml = state.assembled.length ? 
                state.assembled.map(a => {
                    const imgPath = INGREDIENT_IMAGES[a] || '';
                    return `<span class="placed"><img src="${imgPath}" alt="${a}"> ${a}</span>`;
                }).join(' ') : 
                '<span style="color:#880000; font-size:8px; font-family:\'Press Start 2P\',monospace;">📦 Сборка</span>';
            assemblyArea.innerHTML = assemblyHtml;

            const allIngredients = state.neededIngredients.every(i => state.assembled.includes(i));
            const isDishDone = order.dishCompleted[state.currentDishIndex];
            const allDone = order.dishCompleted.every(v => v === true);
            
            let buttonsHtml = '';
            
            if (allDone) {
                buttonsHtml = `<button class="action-btn done" id="finishOrderBtn">✅ ЗАВЕРШИТЬ</button>`;
            } else if (isDishDone) {
                if (order.dishes.length === 1) {
                    buttonsHtml = `<button class="action-btn done" id="finishOrderBtn">✅ ЗАВЕРШИТЬ</button>`;
                } else {
                    buttonsHtml = `<button class="action-btn next" id="nextDishBtn">➡️ СЛЕДУЮЩЕЕ</button>`;
                }
            } else if (state.isSteaming) {
                buttonsHtml = '';
                steamTimerContainer.style.display = 'flex';
                steamTimerDisplay.textContent = `${state.steamSeconds}с`;
            } else if (allIngredients && !state.isFolded) {
                buttonsHtml = `<button class="action-btn fold" id="foldBtn">📦 СВЕРНУТЬ</button>`;
            } else if (state.isFolded && !isDishDone) {
                if (recipe.needsSteam) {
                    buttonsHtml = `<button class="action-btn steam" id="steamBtn">♨️ НА ПАРУ</button>`;
                } else {
                    order.dishCompleted[state.currentDishIndex] = true;
                    const allDoneNow = order.dishCompleted.every(v => v === true);
                    if (allDoneNow) showMessage('✅ Все блюда готовы!');
                    else showMessage(`✅ ${recipe.display} готов!`);
                    renderCookingUI();
                    renderOrders();
                    return;
                }
            }

            if (!state.isSteaming) steamTimerContainer.style.display = 'none';
            actionButtons.innerHTML = buttonsHtml;

            const foldBtn = document.getElementById('foldBtn');
            if (foldBtn) {
                foldBtn.addEventListener('click', () => {
                    if (state.gameOver || !state.shiftActive) return;
                    if (!state.neededIngredients.every(i => state.assembled.includes(i))) {
                        showMessage('⚠️ Не все ингредиенты добавлены');
                        return;
                    }
                    state.isFolded = true;
                    showMessage('✅ Свернули!');
                    renderCookingUI();
                });
            }

            const steamBtn = document.getElementById('steamBtn');
            if (steamBtn) {
                steamBtn.addEventListener('click', () => {
                    if (state.gameOver || !state.shiftActive) return;
                    if (state.isSteaming) return;
                    if (!state.isFolded) { showMessage('⚠️ Сначала сверните'); return; }
                    startSteaming();
                });
            }

            const nextBtn = document.getElementById('nextDishBtn');
            if (nextBtn) {
                nextBtn.addEventListener('click', () => {
                    if (state.gameOver || !state.shiftActive) return;
                    if (order.dishCompleted.every(v => v === true)) { completeOrder(); return; }
                    let nextIdx = -1;
                    for (let i = state.currentDishIndex + 1; i < order.dishes.length; i++) {
                        if (!order.dishCompleted[i]) { nextIdx = i; break; }
                    }
                    if (nextIdx === -1) { completeOrder(); return; }
                    state.currentDishIndex = nextIdx;
                    state.assembled = [];
                    state.currentDishName = order.dishes[nextIdx];
                    state.neededIngredients = MENU[state.currentDishName].ingredients.slice();
                    state.isFolded = false;
                    state.isSteaming = false;
                    steamTimerContainer.style.display = 'none';
                    renderCookingUI();
                    renderOrders();
                    const display = MENU[state.currentDishName].display;
                    showMessage(`🔪 Готовим ${display} (${nextIdx+1}/${order.dishes.length})`);
                });
            }

            const finishBtn = document.getElementById('finishOrderBtn');
            if (finishBtn) {
                finishBtn.addEventListener('click', () => {
                    if (state.gameOver || !state.shiftActive) return;
                    completeOrder();
                });
            }

            if (allDone) stepHint.textContent = '✅ Все блюда готовы! Завершите заказ';
            else if (isDishDone) stepHint.textContent = order.dishes.length === 1 ? '✅ Блюдо готово! Завершите' : '✅ Блюдо готово! Далее';
            else if (state.isSteaming) stepHint.textContent = `♨️ Парится... ${state.steamSeconds}с`;
            else if (allIngredients && !state.isFolded) stepHint.textContent = '📦 Все собрано! Нажмите СВЕРНУТЬ';
            else if (state.isFolded && !isDishDone && recipe.needsSteam) stepHint.textContent = '♨️ Нажмите НА ПАРУ';
            else if (state.isFolded && !isDishDone && !recipe.needsSteam) stepHint.textContent = '✅ Блюдо готово!';
            else {
                const missing = state.neededIngredients.filter(i => !state.assembled.includes(i));
                stepHint.textContent = missing.length ? `📦 Добавьте: ${missing.join(', ')}` : 'Продолжайте';
            }
        }

        function startSteaming() {
            if (state.isSteaming) return;
            state.isSteaming = true;
            state.steamSeconds = 5;
            steamTimerContainer.style.display = 'flex';
            steamTimerDisplay.textContent = `${state.steamSeconds}с`;
            renderCookingUI();
            
            state.steamInterval = setInterval(() => {
                state.steamSeconds--;
                steamTimerDisplay.textContent = `${state.steamSeconds}с`;
                if (state.steamSeconds <= 0) {
                    clearInterval(state.steamInterval);
                    state.steamInterval = null;
                    state.isSteaming = false;
                    steamTimerContainer.style.display = 'none';
                    const order = state.orders[state.currentCookingOrderIdx];
                    if (order && !order.completed) {
                        order.dishCompleted[state.currentDishIndex] = true;
                        const allDone = order.dishCompleted.every(v => v === true);
                        if (allDone) showMessage('✅ Все блюда готовы!');
                        else showMessage(`✅ ${MENU[state.currentDishName].display} готов!`);
                        renderCookingUI();
                        renderOrders();
                    }
                }
            }, 1000);
        }

        function completeOrder() {
            const order = state.orders[state.currentCookingOrderIdx];
            if (!order || order.completed) return;
            if (!order.dishCompleted.every(v => v === true)) {
                showMessage('⚠️ Не все блюда готовы');
                return;
            }
            let totalPrice = order.dishes.reduce((sum, d) => sum + (MENU[d]?.price || 15), 0);
            state.coins += totalPrice;
            state.totalOrdersServed += order.dishes.length;
            order.completed = true;
            updateCoins();
            showMessage(`💰 +${totalPrice} монет за заказ!`);
            
            state.currentCookingOrderIdx = -1;
            state.currentDishIndex = 0;
            state.assembled = [];
            state.currentDishName = null;
            state.isFolded = false;
            if (state.steamTimer) clearTimeout(state.steamTimer);
            if (state.steamInterval) clearInterval(state.steamInterval);
            state.isSteaming = false;
            steamTimerContainer.style.display = 'none';
            recipeContent.innerHTML = '<span style="color:#880000; font-size:8px;">Выберите заказ</span>';
            assemblyArea.innerHTML = '<span style="color:#880000; font-size:8px; font-family:\'Press Start 2P\',monospace;">📦 Сборка</span>';
            stepHint.textContent = 'Нажмите "Готовить" у заказа';
            actionButtons.innerHTML = '';
            renderOrders();
            if (state.coins < -100) gameOver('💸 Банкрот! Ты проиграл.');
        }

        function gameOver(reason) {
            state.gameOver = true;
            state.shiftActive = false;
            if (state.orderInterval) clearInterval(state.orderInterval);
            if (state.timerInterval) clearInterval(state.timerInterval);
            if (state.steamInterval) clearInterval(state.steamInterval);
            if (state.steamTimer) clearTimeout(state.steamTimer);
            showMessage(`⛔ ${reason}`);
            kitchenStatus.textContent = '🚫 Игра окончена';
            shiftBtn.textContent = '🔁 Заново';
            shiftBtn.onclick = () => location.reload();
            actionButtons.innerHTML = '';
        }

        function updateTimers() {
            state.orders.forEach((order, idx) => {
                if (order.completed) return;
                order.remaining -= 0.1;
                if (order.remaining <= 0) {
                    order.remaining = 0;
                    const penalty = order.dishes.length * 10;
                    state.coins -= penalty;
                    order.completed = true;
                    if (state.currentCookingOrderIdx === idx) {
                        state.currentCookingOrderIdx = -1;
                        state.currentDishIndex = 0;
                        state.assembled = [];
                        state.currentDishName = null;
                        state.isFolded = false;
                        if (state.steamInterval) clearInterval(state.steamInterval);
                        state.isSteaming = false;
                        steamTimerContainer.style.display = 'none';
                        recipeContent.innerHTML = '<span style="color:#880000; font-size:8px;">Выберите заказ</span>';
                        assemblyArea.innerHTML = '<span style="color:#880000; font-size:8px; font-family:\'Press Start 2P\',monospace;">📦 Сборка</span>';
                        stepHint.textContent = 'Нажмите "Готовить" у заказа';
                        actionButtons.innerHTML = '';
                    }
                    showMessage(`⏰ Время вышло! Штраф -${penalty} монет`);
                    updateCoins();
                    if (state.coins < -100) gameOver('💸 Банкрот! Ты проиграл.');
                    renderOrders();
                }
            });
            renderOrders();
        }

        document.querySelectorAll('.ingredient-box').forEach(box => {
            box.addEventListener('click', function() {
                if (state.gameOver || !state.shiftActive || state.currentCookingOrderIdx === -1) {
                    showMessage('⚠️ Начните готовить заказ');
                    return;
                }
                const order = state.orders[state.currentCookingOrderIdx];
                if (!order || !state.currentDishName || order.completed) return;
                if (order.dishCompleted[state.currentDishIndex]) {
                    showMessage('⚠️ Это блюдо уже готово');
                    return;
                }
                const recipe = MENU[state.currentDishName];
                if (!recipe) return;
                const ing = this.dataset.ing;
                if (!state.neededIngredients.includes(ing)) {
                    showMessage(`❌ ${ing} не нужен`);
                    return;
                }
                if (state.assembled.includes(ing)) {
                    showMessage(`⚠️ ${ing} уже добавлен`);
                    return;
                }
                if (state.isFolded) { showMessage('⚠️ Блюдо уже свернуто'); return; }
                if (state.isSteaming) { showMessage('⚠️ Идёт пар'); return; }
                state.assembled.push(ing);
                showMessage(`✅ Добавлен ${ing}`);
                renderCookingUI();
                renderOrders();
            });
        });

        function startShift() {
            if (state.gameOver || state.shiftActive) return;
            state.shiftActive = true;
            state.orders = [];
            state.totalOrdersServed = 0;
            state.coins = 0;
            state.currentCookingOrderIdx = -1;
            state.currentDishIndex = 0;
            state.assembled = [];
            state.currentDishName = null;
            state.isFolded = false;
            state.orderCounter = 0;
            updateCoins();
            shiftBtn.textContent = 'Завершить смену';
            shiftBtn.classList.add('active');
            kitchenStatus.textContent = '🍳 Смена активна! Принимай заказы!';
            showMessage('Смена началась!');
            generateOrder();
            if (state.orderInterval) clearInterval(state.orderInterval);
            state.orderInterval = setInterval(() => {
                if (state.shiftActive && !state.gameOver) generateOrder();
            }, 15000);
            if (state.timerInterval) clearInterval(state.timerInterval);
            state.timerInterval = setInterval(() => {
                if (state.shiftActive && !state.gameOver) updateTimers();
            }, 100);
            renderOrders();
            recipeContent.innerHTML = '<span style="color:#880000; font-size:8px;">Выберите заказ</span>';
            stepHint.textContent = 'Нажмите "Готовить" у заказа';
            actionButtons.innerHTML = '';
        }

        function endShift() {
            if (!state.shiftActive) return;
            state.shiftActive = false;
            if (state.orderInterval) clearInterval(state.orderInterval);
            if (state.timerInterval) clearInterval(state.timerInterval);
            if (state.steamInterval) clearInterval(state.steamInterval);
            shiftBtn.textContent = 'Выйти на смену';
            shiftBtn.classList.remove('active');
            kitchenStatus.textContent = '🍳 Смена завершена';
            showMessage('⏹ Смена завершена!');
            state.orders = [];
            renderOrders();
            recipeContent.innerHTML = '<span style="color:#880000; font-size:8px;">Выберите заказ</span>';
            assemblyArea.innerHTML = '<span style="color:#880000; font-size:8px; font-family:\'Press Start 2P\',monospace;">📦 Сборка</span>';
            stepHint.textContent = 'Нажмите "Выйти на смену"';
            actionButtons.innerHTML = '';
            state.currentCookingOrderIdx = -1;
            state.currentDishIndex = 0;
            state.assembled = [];
            state.currentDishName = null;
            state.isFolded = false;
            state.isSteaming = false;
            steamTimerContainer.style.display = 'none';
        }

        // ---------- NAVIGATION ----------
        $('startBtn').addEventListener('click', () => {
            startScreen.classList.add('hidden');
            nameScreen.classList.remove('hidden');
        });

        $('nameConfirmBtn').addEventListener('click', () => {
            const name = nameInput.value.trim() || 'Шеф';
            state.name = name;
            nameScreen.classList.add('hidden');
            rulesScreen.classList.remove('hidden');
            rulesText.textContent = `Привет, ${name}! Ты повар в кафе "Поке рамен", твоя задача выполнять заказы, которые тебе будут приходить.`;
        });

        $('rulesAcceptBtn').addEventListener('click', () => {
            rulesScreen.classList.add('hidden');
            gameScreen.classList.remove('hidden');
            showMessage(`🍜 Добро пожаловать, ${state.name}!`);
            shiftBtn.onclick = () => {
                if (!state.shiftActive) {
                    startShift();
                } else {
                    endShift();
                }
            };
        });

        updateCoins();
    })();
</script>
</body>
</html>
